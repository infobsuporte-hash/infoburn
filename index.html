<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>infoburn - Catálogo de Aplicativos</title>
<style>
  :root {
    --accent: #FF8C00;
    --accent-dark: #cc6f00;
    --bg: #0f0f13;
    --surface: #1a1a22;
    --surface2: #22222e;
    --surface3: #2a2a38;
    --border: #2e2e3e;
    --text: #e8e8f0;
    --text2: #9090a8;
    --text3: #5a5a72;
    --success: #22c55e;
    --radius: 12px;
    --radius-sm: 8px;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ── HEADER ── */
  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .header-inner {
    max-width: 1280px;
    margin: 0 auto;
    padding: 0 20px;
    height: 64px;
    display: flex;
    align-items: center;
    gap: 20px;
  }
  .logo-area {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
  }
  .logo-icon {
    width: 36px;
    height: 36px;
    background: var(--accent);
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
  }
  .logo-text h1 {
    font-size: 15px;
    font-weight: 700;
    letter-spacing: .5px;
    line-height: 1;
  }
  .logo-text span {
    font-size: 10px;
    color: var(--text2);
    text-transform: uppercase;
    letter-spacing: 1.5px;
  }
  .search-wrap {
    flex: 1;
    max-width: 400px;
    position: relative;
  }
  .search-wrap input {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 12px 8px 36px;
    color: var(--text);
    font-size: 14px;
    outline: none;
    transition: border-color .2s;
  }
  .search-wrap input:focus { border-color: var(--accent); }
  .search-wrap input::placeholder { color: var(--text3); }
  .search-icon {
    position: absolute;
    left: 10px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text3);
    pointer-events: none;
    font-size: 15px;
  }

  /* ── MAIN ── */
  main {
    max-width: 1280px;
    margin: 0 auto;
    padding: 32px 20px;
  }

  /* ── TOOLBAR ── */
  .toolbar {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
    margin-bottom: 24px;
  }
  .toolbar-left {}
  .toolbar-eyebrow {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--accent);
    font-weight: 600;
    margin-bottom: 4px;
  }
  .toolbar-title {
    font-size: 22px;
    font-weight: 700;
    color: var(--text);
  }
  .toolbar-right {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  .chip-row {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }
  .chip {
    padding: 6px 14px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text2);
    font-size: 13px;
    cursor: pointer;
    transition: all .15s;
  }
  .chip:hover { border-color: var(--accent); color: var(--accent); }
  .chip.active { background: var(--accent); border-color: var(--accent); color: #000; font-weight: 600; }
  .sort-select {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text2);
    padding: 6px 10px;
    border-radius: 8px;
    font-size: 13px;
    cursor: pointer;
    outline: none;
  }
  .results-count {
    font-size: 13px;
    color: var(--text3);
    white-space: nowrap;
  }

  /* ── GRID ── */
  .apps-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 16px;
  }

  /* ── CARD ── */
  .app-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    transition: border-color .2s, transform .15s;
    cursor: default;
  }
  .app-card:hover { border-color: var(--accent); transform: translateY(-2px); }

  .card-top {
    display: flex;
    gap: 14px;
    align-items: flex-start;
  }
  .card-icon {
    width: 54px;
    height: 54px;
    border-radius: 12px;
    background: var(--surface2);
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    overflow: hidden;
  }
  .card-icon img { width: 100%; height: 100%; object-fit: cover; border-radius: 12px; }
  .card-info { flex: 1; min-width: 0; }

  .badge-row { margin-bottom: 4px; }
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 11px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 20px;
    text-transform: uppercase;
    letter-spacing: .5px;
  }
  .badge-updated { background: rgba(34,197,94,.12); color: #22c55e; }
  .badge-recommended { background: rgba(255,140,0,.12); color: var(--accent); }

  .card-name-row {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  .card-name {
    font-size: 15px;
    font-weight: 700;
    color: var(--text);
  }
  .version-pill {
    font-size: 11px;
    padding: 2px 7px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 20px;
    color: var(--text2);
  }

  .meta-strip {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-top: 6px;
  }
  .meta-item {
    display: flex;
    align-items: center;
    gap: 4px;
    font-size: 12px;
    color: var(--text2);
  }
  .meta-item svg { width: 13px; height: 13px; opacity: .6; }
  .meta-item strong { color: var(--text); }

  .card-desc {
    font-size: 13px;
    color: var(--text2);
    line-height: 1.5;
  }

  .notice-box {
    background: rgba(255,140,0,.08);
    border: 1px solid rgba(255,140,0,.2);
    border-radius: 8px;
    padding: 8px 10px;
    font-size: 12px;
    color: #ffb547;
    display: flex;
    gap: 6px;
    align-items: flex-start;
  }

  .codes-row {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
  }
  .codes-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--text3);
    margin-bottom: 8px;
  }
  .codes-grid { display: flex; gap: 8px; flex-wrap: wrap; }
  .code-item {
    display: flex;
    align-items: center;
    gap: 6px;
    background: var(--surface3);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 5px 10px;
    cursor: pointer;
    transition: border-color .15s;
    flex: 1;
    min-width: 100px;
  }
  .code-item:hover { border-color: var(--accent); }
  .code-label { font-size: 10px; color: var(--text3); text-transform: uppercase; letter-spacing: .5px; }
  .code-value { font-size: 14px; font-weight: 700; font-family: monospace; color: var(--text); }

  .card-actions {
    display: flex;
    gap: 8px;
    margin-top: auto;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 9px 16px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    border: none;
    transition: all .15s;
  }
  .btn-primary {
    background: var(--accent);
    color: #000;
    flex: 1;
  }
  .btn-primary:hover { background: var(--accent-dark); }
  .btn-secondary {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text2);
  }
  .btn-secondary:hover { border-color: var(--accent); color: var(--accent); }

  /* ── EMPTY STATE ── */
  .empty-state {
    grid-column: 1/-1;
    text-align: center;
    padding: 80px 20px;
    color: var(--text3);
  }
  .empty-state svg { width: 48px; height: 48px; margin-bottom: 16px; opacity: .4; }
  .empty-state h3 { font-size: 18px; color: var(--text2); margin-bottom: 8px; }
  .empty-state p { font-size: 14px; }

  /* ── DRAWER ── */
  .drawer-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.6);
    z-index: 200;
    opacity: 0;
    pointer-events: none;
    transition: opacity .25s;
  }
  .drawer-overlay.open { opacity: 1; pointer-events: all; }

  .drawer {
    position: fixed;
    top: 0;
    right: 0;
    bottom: 0;
    width: min(460px, 100vw);
    background: var(--surface);
    border-left: 1px solid var(--border);
    z-index: 201;
    display: flex;
    flex-direction: column;
    transform: translateX(100%);
    transition: transform .3s cubic-bezier(.4,0,.2,1);
    overflow: hidden;
  }
  .drawer.open { transform: translateX(0); }

  .drawer-head {
    padding: 20px 20px 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
    flex-shrink: 0;
  }
  .drawer-title-block { display: flex; gap: 14px; align-items: center; }
  .drawer-icon {
    width: 52px;
    height: 52px;
    border-radius: 12px;
    background: var(--surface2);
    flex-shrink: 0;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
  }
  .drawer-icon img { width: 100%; height: 100%; object-fit: cover; }
  #drawerName { font-size: 18px; font-weight: 700; }
  #drawerSub { font-size: 13px; color: var(--text2); margin-top: 2px; }
  .drawer-close {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text2);
    width: 32px;
    height: 32px;
    border-radius: 8px;
    cursor: pointer;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all .15s;
  }
  .drawer-close:hover { border-color: var(--accent); color: var(--accent); }

  .drawer-body {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }
  .drawer-section h4 {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--text3);
    margin-bottom: 10px;
  }
  .drawer-meta-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  .drawer-meta-item {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
  }
  .drawer-meta-item small { font-size: 11px; color: var(--text3); display: block; margin-bottom: 2px; }
  .drawer-meta-item span { font-size: 14px; font-weight: 600; }

  .drawer-foot {
    padding: 16px 20px;
    border-top: 1px solid var(--border);
    display: flex;
    gap: 10px;
    flex-shrink: 0;
  }
  .drawer-foot .btn-primary { flex: 1; padding: 12px; }

  /* ── DOWNLOAD MODAL ── */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.7);
    z-index: 300;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s;
  }
  .modal-overlay.open { opacity: 1; pointer-events: all; }

  .modal-panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    width: 100%;
    max-width: 380px;
    padding: 32px 28px;
    text-align: center;
    position: relative;
    transform: scale(.95);
    transition: transform .2s;
  }
  .modal-overlay.open .modal-panel { transform: scale(1); }
  .modal-close-btn {
    position: absolute;
    top: 14px;
    right: 14px;
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text2);
    width: 30px;
    height: 30px;
    border-radius: 8px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .modal-app-icon {
    width: 68px;
    height: 68px;
    border-radius: 16px;
    background: var(--surface2);
    margin: 0 auto 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 30px;
    overflow: hidden;
    position: relative;
  }
  .modal-app-icon img { width: 100%; height: 100%; object-fit: cover; border-radius: 16px; }
  .modal-check {
    position: absolute;
    bottom: -4px;
    right: -4px;
    width: 22px;
    height: 22px;
    background: var(--success);
    border-radius: 50%;
    border: 2px solid var(--surface);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    color: #fff;
  }
  .modal-title { font-size: 17px; font-weight: 700; margin-bottom: 6px; }
  .modal-sub { font-size: 14px; color: var(--text2); margin-bottom: 20px; }
  .countdown-ring {
    width: 72px;
    height: 72px;
    margin: 0 auto 20px;
    position: relative;
  }
  .countdown-ring svg {
    width: 72px;
    height: 72px;
    transform: rotate(-90deg);
  }
  .countdown-ring circle {
    fill: none;
    stroke-width: 5;
    stroke-linecap: round;
  }
  .countdown-ring .track { stroke: var(--surface3); }
  .countdown-ring .prog {
    stroke: var(--accent);
    stroke-dasharray: 196;
    stroke-dashoffset: 0;
    transition: stroke-dashoffset 1s linear;
  }
  .countdown-num {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    font-weight: 800;
    color: var(--accent);
  }
  .modal-bar-wrap {
    background: var(--surface3);
    border-radius: 4px;
    height: 4px;
    overflow: hidden;
    margin-bottom: 20px;
  }
  .modal-bar {
    height: 100%;
    background: var(--accent);
    width: 0%;
    transition: width 1s linear;
    border-radius: 4px;
  }
  .modal-ready {
    color: var(--success);
    font-weight: 600;
    margin-bottom: 16px;
    display: none;
  }
  .modal-actions { display: flex; flex-direction: column; gap: 8px; }
  .modal-btn {
    padding: 11px 20px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    border: none;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    text-decoration: none;
    transition: all .15s;
  }
  .modal-btn-primary { background: var(--accent); color: #000; }
  .modal-btn-primary:hover { background: var(--accent-dark); }
  .modal-btn-secondary {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text2);
  }
  .modal-btn-secondary:hover { border-color: var(--border); color: var(--text); }

  /* ── TOAST ── */
  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: var(--surface3);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px 18px;
    border-radius: 8px;
    font-size: 13px;
    z-index: 999;
    transition: transform .3s;
    white-space: nowrap;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }

  /* ── FOOTER ── */
  footer {
    border-top: 1px solid var(--border);
    padding: 20px;
    text-align: center;
    color: var(--text3);
    font-size: 13px;
    margin-top: 48px;
  }

  /* ── RESPONSIVE ── */
  @media (max-width: 600px) {
    .toolbar { flex-direction: column; align-items: flex-start; }
    .header-inner { gap: 12px; }
    .drawer { width: 100vw; }
  }
</style>
</head>

// ═══════════════════════════════
//  UTILS
// ═══════════════════════════════
function fmtBytes(b) {
  if (b >= 1073741824) return (b / 1073741824).toFixed(1) + ' GB';
  if (b >= 1048576) return (b / 1048576).toFixed(1) + ' MB';
  if (b >= 1024) return (b / 1024).toFixed(0) + ' KB';
  return b + ' B';
}
function fmtNum(n) { return n.toLocaleString('pt-BR'); }
function fmtAgo(ts) {
  const s = Math.floor((Date.now() - ts) / 1000);
  if (s < 60) return 'agora mesmo';
  if (s < 3600) return Math.floor(s / 60) + ' min';
  if (s < 86400) return Math.floor(s / 3600) + 'h';
  return Math.floor(s / 86400) + 'd';
}

// ═══════════════════════════════
//  STATE
// ═══════════════════════════════
let activeFilter = null;
let sortBy = 'downloads';
let searchQ = '';

// ═══════════════════════════════
//  RENDER
// ═══════════════════════════════
function renderApps() {
  let list = [...APPS];

  // filter
  if (activeFilter) {
    list = list.filter(a => a.platforms.includes(activeFilter));
  }

  // search
  if (searchQ) {
    const q = searchQ.toLowerCase();
    list = list.filter(a =>
      a.name.toLowerCase().includes(q) ||
      a.description.toLowerCase().includes(q) ||
      a.platformLabel.toLowerCase().includes(q)
    );
  }

  // sort
  if (sortBy === 'downloads') list.sort((a, b) => b.downloads - a.downloads);
  else if (sortBy === 'updated') list.sort((a, b) => b.updatedTs - a.updatedTs);
  else if (sortBy === 'size-asc') list.sort((a, b) => a.size - b.size);

  document.getElementById('resultsCount').textContent = list.length + ' resultado' + (list.length !== 1 ? 's' : '');

  const grid = document.getElementById('appsGrid');
  grid.innerHTML = '';

  if (!list.length) {
    grid.innerHTML = `
      <div class="empty-state">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <h3>Nenhum app encontrado</h3>
        <p>Tente ajustar a busca ou limpar os filtros.</p>
      </div>`;
    return;
  }

  list.forEach(app => {
    const badgeHtml = app.status.includes('updated')
      ? `<span class="badge badge-updated">✓ Atualizado <small style="opacity:.6;font-size:10px;margin-left:4px">${fmtAgo(app.updatedTs)}</small></span>`
      : app.status.includes('recommended')
      ? `<span class="badge badge-recommended">★ Recomendado</span>`
      : '';

    const codesHtml = (app.ntdown || app.downloader) ? `
      <div class="codes-row">
        <div class="codes-label">Instalação rápida</div>
        <div class="codes-grid">
          ${app.ntdown ? `<div class="code-item" onclick="copyCode('${app.ntdown}')">
            <div><div class="code-label">NTDOWN</div><div class="code-value">${app.ntdown}</div></div>
          </div>` : ''}
          ${app.downloader ? `<div class="code-item" onclick="copyCode('${app.downloader}')">
            <div><div class="code-label">DOWNLOADER</div><div class="code-value">${app.downloader}</div></div>
          </div>` : ''}
        </div>
      </div>` : '';

    const noticeHtml = app.notice ? `
      <div class="notice-box">⚠️ <span>${app.notice}</span></div>` : '';

    const iconHtml = app.icon
      ? `<img src="${app.icon}" alt="${app.name}">`
      : app.emoji;

    const el = document.createElement('article');
    el.className = 'app-card';
    el.dataset.id = app.id;
    el.innerHTML = `
      <div class="card-top">
        <div class="card-icon">${iconHtml}</div>
        <div class="card-info">
          ${badgeHtml ? `<div class="badge-row">${badgeHtml}</div>` : ''}
          <div class="card-name-row">
            <span class="card-name">${app.name}</span>
            ${app.version ? `<span class="version-pill">v${app.version}</span>` : ''}
          </div>
          <div class="meta-strip">
            <span class="meta-item">🖥 ${app.platformLabel}</span>
            <span class="meta-item">💾 ${app.size ? fmtBytes(app.size) : '—'}</span>
            <span class="meta-item">⬇ <strong>${fmtNum(app.downloads)}</strong>&nbsp;downloads</span>
          </div>
        </div>
      </div>
      <p class="card-desc">${app.description}</p>
      ${noticeHtml}
      ${codesHtml}
      <div class="card-actions">
        <button class="btn btn-primary" onclick="openDownloadModal('${app.id}')">${app.externalLink ? '🔗' : '⬇'} ${app.downloadLabel}</button>
        ${app.downloadUrl2 ? `<a class="btn btn-secondary" href="${app.downloadUrl2}" target="_blank" rel="noopener">🔗 unitv.tube</a>` : `<button class="btn btn-secondary" onclick="openDrawer('${app.id}')">☰ Detalhes</button>`}
      </div>`;
    grid.appendChild(el);
  });
}

// ═══════════════════════════════
//  DRAWER
// ═══════════════════════════════
function openDrawer(id) {
  const app = APPS.find(a => a.id === id);
  if (!app) return;

  const iconHtml = app.icon ? `<img src="${app.icon}" alt="">` : app.emoji;
  document.getElementById('drawerIconWrap').innerHTML = iconHtml;
  document.getElementById('drawerName').textContent = app.name;
  document.getElementById('drawerSub').textContent = app.platformLabel + (app.version ? ' • v' + app.version : '');

  const body = document.getElementById('drawerBody');
  body.innerHTML = `
    <div class="drawer-section">
      <h4>Sobre o app</h4>
      <p style="font-size:14px;color:var(--text2);line-height:1.6">${app.description}</p>
      ${app.notice ? `<div class="notice-box" style="margin-top:10px">⚠️ <span>${app.notice}</span></div>` : ''}
    </div>
    <div class="drawer-section">
      <h4>Informações</h4>
      <div class="drawer-meta-grid">
        <div class="drawer-meta-item"><small>Plataforma</small><span>${app.platformLabel}</span></div>
        <div class="drawer-meta-item"><small>Versão</small><span>${app.version || '—'}</span></div>
        <div class="drawer-meta-item"><small>Tamanho</small><span>${app.size ? fmtBytes(app.size) : '—'}</span></div>
        <div class="drawer-meta-item"><small>Downloads</small><span>${fmtNum(app.downloads)}</span></div>
        <div class="drawer-meta-item"><small>Atualizado</small><span>${fmtAgo(app.updatedTs)}</span></div>
        <div class="drawer-meta-item"><small>Categoria</small><span style="text-transform:capitalize">${app.category}</span></div>
      </div>
    </div>
    ${(app.ntdown || app.downloader) ? `
    <div class="drawer-section">
      <h4>Códigos de instalação</h4>
      <div class="codes-row">
        <div class="codes-grid">
          ${app.ntdown ? `<div class="code-item" onclick="copyCode('${app.ntdown}')">
            <div><div class="code-label">NTDOWN</div><div class="code-value">${app.ntdown}</div></div>
          </div>` : ''}
          ${app.downloader ? `<div class="code-item" onclick="copyCode('${app.downloader}')">
            <div><div class="code-label">DOWNLOADER</div><div class="code-value">${app.downloader}</div></div>
          </div>` : ''}
        </div>
      </div>
    </div>` : ''}`;

  document.getElementById('drawerFoot').innerHTML = `
    <button class="btn btn-primary" onclick="openDownloadModal('${app.id}');closeDrawer()">⬇ ${app.downloadLabel}</button>
    <button class="btn btn-secondary" onclick="copyCode('${window.location.href}#app-${app.id}');closeDrawer()">🔗 Copiar link</button>`;

  document.getElementById('drawer').classList.add('open');
  document.getElementById('drawerOverlay').classList.add('open');
  document.getElementById('drawer').focus();
}

function closeDrawer() {
  document.getElementById('drawer').classList.remove('open');
  document.getElementById('drawerOverlay').classList.remove('open');
}

// ═══════════════════════════════
//  DOWNLOAD MODAL
// ═══════════════════════════════
let dlTimer = null;

function openDownloadModal(id) {
  const app = APPS.find(a => a.id === id);
  if (!app) return;

  // External links (stores) open directly in a new tab
  if (app.externalLink && app.downloadUrl && app.downloadUrl !== '#') {
    window.open(app.downloadUrl, '_blank', 'noopener');
    return;
  }

  clearTimeout(dlTimer);

  const iconHtml = app.icon ? `<img src="${app.icon}" alt=""><div class="modal-check">✓</div>` : `<span style="font-size:28px">${app.emoji}</span><div class="modal-check">✓</div>`;
  document.getElementById('dlIcon').innerHTML = iconHtml;
  document.getElementById('dlTitle').textContent = app.name;
  document.getElementById('dlSub').textContent = 'Seu download começa automaticamente em:';
  document.getElementById('dlNum').textContent = '3';
  document.getElementById('dlBar').style.width = '0%';
  document.getElementById('dlReady').style.display = 'none';
  document.getElementById('dlRing').style.display = '';
  document.getElementById('dlAction').href = app.downloadUrl;
  document.getElementById('dlAction').textContent = '⬇ ' + app.downloadLabel;
  document.getElementById('dlProg').style.strokeDashoffset = '0';

  document.getElementById('dlOverlay').classList.add('open');

  let count = 3;
  const circ = 2 * Math.PI * 31; // ≈ 194.78

  function tick() {
    count--;
    document.getElementById('dlNum').textContent = count;
    document.getElementById('dlBar').style.width = ((3 - count) / 3 * 100) + '%';
    document.getElementById('dlProg').style.strokeDashoffset = ((3 - count) / 3 * circ) + 'px';
    if (count <= 0) {
      document.getElementById('dlRing').style.display = 'none';
      document.getElementById('dlSub').textContent = '';
      document.getElementById('dlReady').style.display = 'block';
      // trigger download
      const a = document.createElement('a');
      a.href = app.downloadUrl;
      a.download = '';
      a.click();
    } else {
      dlTimer = setTimeout(tick, 1000);
    }
  }
  dlTimer = setTimeout(tick, 1000);
}

function closeDownloadModal() {
  clearTimeout(dlTimer);
  document.getElementById('dlOverlay').classList.remove('open');
}

// ═══════════════════════════════
//  COPY / TOAST
// ═══════════════════════════════
function copyCode(text) {
  navigator.clipboard.writeText(text).then(() => showToast('Copiado: ' + text)).catch(() => showToast('Código: ' + text));
}
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

// ═══════════════════════════════
//  EVENTS
// ═══════════════════════════════
document.getElementById('searchInput').addEventListener('input', e => {
  searchQ = e.target.value.trim();
  renderApps();
});

document.getElementById('sortSelect').addEventListener('change', e => {
  sortBy = e.target.value;
  renderApps();
});

document.getElementById('chipRow').addEventListener('click', e => {
  const chip = e.target.closest('.chip');
  if (!chip) return;
  const f = chip.dataset.filter;
  if (activeFilter === f) {
    activeFilter = null;
    chip.classList.remove('active');
  } else {
    document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
    chip.classList.add('active');
    activeFilter = f;
  }
  renderApps();
});

document.getElementById('drawerOverlay').addEventListener('click', closeDrawer);
document.getElementById('drawerClose').addEventListener('click', closeDrawer);
document.getElementById('dlClose').addEventListener('click', closeDownloadModal);
document.getElementById('dlBack').addEventListener('click', closeDownloadModal);
document.getElementById('dlOverlay').addEventListener('click', e => {
  if (e.target === e.currentTarget) closeDownloadModal();
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeDrawer(); closeDownloadModal(); }
});

// ═══════════════════════════════
//  INIT
// ═══════════════════════════════
renderApps();
</script>
